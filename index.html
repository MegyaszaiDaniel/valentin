<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Valentin 💘</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            /* Kezdőoldal háttér: romantikus kép */
            background-image: url("https://images.unsplash.com/photo-1557683316-973673baf926?fit=crop&w=1950&q=80");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #yes {
            background-color: #e91e63;
            color: white;
        }

        #no {
            background-color: #999;
            position: absolute;
        }

        /* Szívecskék */
        .heart {
            position: fixed;
            top: -20px;
            font-size: 20px;
            animation: fall linear forwards;
            color: #e91e63;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        /* Igen oldal */
        #yesPage {
            display: none;
            position: absolute;
            inset: 0;
            /* Igen oldal háttér: más romantikus kép */
            background-image: url("https://images.unsplash.com/photo-1512931863410-7e2263c8b59d?fit=crop&w=1950&q=80");
            background-size: cover;
            background-position: center;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 40px;
            z-index: 5;
        }
