<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Valentin 💘</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background-image: url("https://peanuts.store/cdn/shop/files/Valentine_s_Day_Mobile.png?v=1705977822");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #yes {
            background-color: #e91e63;
            color: white;
        }

        #no {
            background-color: #999;
            position: absolute;
        }

        /* Szívecskék */
        .heart {
            position: fixed;
            top: -20px;
            font-size: 20px;
            animation: fall linear forwards;
            color: #e91e63;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
                opacity: 0;
            }
        }

        /* Igen oldal */
        #yesPage {
            display: none;
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #ff5f9e, #ff2d75);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 40px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <h1>Leszel a valentinom? 💘</h1>
        <button id="yes">Igen</button>
        <button id="no">Nem</button>
    </div>

    <div id="yesPage">
        <div>Nagyon szeretleek!!! 💖🥰</div>
        <div style="font-size:25px;margin-top:20px;">
            Szombaton találkozunk
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("no");
        const yesBtn = document.getElementById("yes");
        const yesPage = document.getElementById("yesPage");
        const mainBox = document.getElementById("mainBox");

        // Nem gomb elszökik
        noBtn.addEventListener("mouseover", () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        });

        // Igen oldal
        yesBtn.addEventListener("click", () => {
            mainBox.style.display = "none";
            yesPage.style.display = "flex";
        });

        // Hulló szívecskék
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (3 + Math.random() * 3) + "s";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
